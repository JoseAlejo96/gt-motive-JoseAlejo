<div class="vehicle-detail-container">
    <div class="header">
        <button mat-icon-button (click)="goBack()" class="back-button">
            <mat-icon>arrow_back</mat-icon>
        </button>
        @if (selectedMake()) {
        <div class="title-section">
            <h1>{{ selectedMake()!.name }}</h1>
            <p class="subtitle">Vehicle details and specifications</p>
        </div>
        }
    </div>

    <div class="content">
        <app-vehicle-types-card [vehicleTypes]="vehicleTypes()" [isLoading]="typesLoading()" />

        <app-vehicle-models-card [models]="models()" [isLoading]="modelsLoading()" />
    </div>
</div>
