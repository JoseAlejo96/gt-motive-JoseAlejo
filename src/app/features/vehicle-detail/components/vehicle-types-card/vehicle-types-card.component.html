<mat-card class="info-card">
    <mat-card-header>
        <mat-card-title>
            <mat-icon>directions_car</mat-icon>
            Vehicle Types
        </mat-card-title>
    </mat-card-header>
    <mat-divider></mat-divider>
    <mat-card-content>
        @if (isLoading()) {
        <div class="loading">
            <mat-spinner diameter="40"></mat-spinner>
            <p>Loading...</p>
        </div>
        } @else if (vehicleTypes().length === 0) {
        <div class="empty-state">
            <mat-icon>info</mat-icon>
            <p>No vehicle types available</p>
        </div>
        } @else {
        <div class="types-list">
            @for (type of vehicleTypes(); track type.VehicleTypeId) {
            <div class="type-item">
                <mat-icon>check_circle</mat-icon>
                <span>{{ type.VehicleTypeName }}</span>
            </div>
            }
        </div>
        }
    </mat-card-content>
</mat-card>
